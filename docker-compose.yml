services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sendmail_dev
    ports:
      - "5432:5432"
    volumes:
      - sendmail_pg_data:/var/lib/postgresql/data

volumes:
  sendmail_pg_data:
